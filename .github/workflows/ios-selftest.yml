name: iOS simulator self-test

on:
  workflow_dispatch:
  push:
    branches: [ios-selftest]

permissions:
  contents: write

jobs:
  selftest:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      VITE_SPARK_SELFTEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm install -g pnpm@12.15.0
          pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Build web app
        run: pnpm exec vite build
      - name: Create iOS project
        run: |
          pnpm exec cap add ios
          pnpm exec cap sync ios
          python3 scripts/ios-prepare.py
      - name: Compile for simulator
        run: |
          cd ios/App
          if [ -f Podfile ]; then pod install; TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO build | tail -n 20
      - name: Run in simulator
        run: |
          mkdir -p report
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "device $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build/Build/Products/Debug-iphonesimulator/App.app
          (xcrun simctl launch --console-pty "$UDID" com.spark.player > report/console.txt 2>&1 &)
          for i in 1 2 3 4 5 6; do sleep 25; xcrun simctl io "$UDID" screenshot "report/shot-$i.png" || true; done
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "App"' > report/oslog.txt 2>&1 || true
          xcrun simctl terminate "$UDID" com.spark.player || true
          wc -l report/*.txt
      - name: Publish report
        if: always()
        run: |
          mkdir -p publish && cp -R report/. publish/ 2>/dev/null || true
          cd publish
          git init -q -b selftest-report
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "selftest report ${GITHUB_SHA}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" selftest-report
